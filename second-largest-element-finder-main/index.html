<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Largest Element Finder</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">
        <h1 class="heading">Second Largest Element Finder</h1>

        <div class="input-group">
            <label for="numElements">Enter the number of elements:</label>
            <input type="number" id="numElements" placeholder="e.g., 5" class="input-field">
        </div>

        <div class="input-group" style="margin-bottom: 1.5rem;">
            <label for="elementsInput">Enter the elements (comma-separated):</label>
            <input type="text" id="elementsInput" placeholder="e.g., 10, 5, 20, 15, 25" class="input-field">
        </div>

        <button id="findButton" class="button">
            Find
        </button>

        <div id="resultContainer" class="result-container hidden">
            <h2 class="result-heading">Result:</h2>
            <p id="resultDisplay" class="result-text"></p>
        </div>
    </div>

    <script>
        function findSecondLargest(arr) {
            if (arr.length < 2) {
                return -1;
            }

            let largest = -Infinity;
            let secondLargest = -Infinity;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > largest) {
                    secondLargest = largest;
                    largest = arr[i];
                } else if (arr[i] > secondLargest && arr[i] !== largest) {
                    secondLargest = arr[i];
                }
            }

            if (secondLargest === -Infinity) {
                return -1;
            }

            return secondLargest;
        }

        const numElementsInput = document.getElementById('numElements');
        const elementsInput = document.getElementById('elementsInput');
        const findButton = document.getElementById('findButton');
        const resultContainer = document.getElementById('resultContainer');
        const resultDisplay = document.getElementById('resultDisplay');

        findButton.addEventListener('click', () => {
            const elementsString = elementsInput.value;
            let numbers = [];

            if (elementsString.trim() !== '') {
                numbers = elementsString.split(',')
                                        .map(s => Number(s.trim()))
                                        .filter(n => !isNaN(n));
            }

            if (numbers.length === 0) {
                resultContainer.classList.remove('hidden');
                resultContainer.classList.add('error');
                resultDisplay.textContent = "Please enter valid numbers (comma-separated).";
                resultDisplay.classList.add('error');
                return;
            } else {
                resultContainer.classList.remove('error');
                resultDisplay.classList.remove('error');
            }

            const result = findSecondLargest(numbers);

            resultContainer.classList.remove('hidden');

            if (result === -1) {
                resultDisplay.textContent = "Second largest element does not exist (e.g., less than two distinct elements or invalid input).";
            } else {
                resultDisplay.textContent = `Second largest element in the above elements is: ${result}`;
            }
        });
    </script>
</body>
</html>
